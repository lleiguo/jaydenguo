name: Deploy

# Deploys main to Google Cloud after CI passes (plan M0.7). Needs repository
# variables GCP_PROJECT_ID, GCP_REGION, GCP_REGISTRY, GCP_WIF_PROVIDER and
# GCP_DEPLOYER_SA (from `terraform output`); skipped until they exist.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.GCP_WIF_PROVIDER != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGISTRY }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3

      # Layers are cached in the registry ("cache" image), so an unchanged
      # lockfile skips the package install.
      - name: Build and push images
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          for image in web worker; do
            docker buildx build -f "docker/${image}.Dockerfile" -t "${REGISTRY}/${image}:${SHA}" --push \
              --cache-from "type=registry,ref=${REGISTRY}/cache:${image}" \
              --cache-to "type=registry,ref=${REGISTRY}/cache:${image},mode=max,image-manifest=true,oci-mediatypes=true" .
          done

      - name: Update worker and migrate the database
        timeout-minutes: 10
        run: |
          gcloud run jobs update worker --region "$REGION" --image "${REGISTRY}/worker:${SHA}"
          gcloud run jobs execute worker --region "$REGION" --args=migrate --wait

      - name: Deploy web
        run: gcloud run deploy web --region "$REGION" --image "${REGISTRY}/web:${SHA}" --quiet

      - name: Smoke test
        run: |
          url=$(gcloud run services describe web --region "$REGION" --format='value(status.url)')
          curl -fsS "${url}/api/healthz"
