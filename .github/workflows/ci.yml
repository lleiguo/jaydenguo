name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # To look up a PR run's "tested" marker (below).
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A PR run tests the PR merged into main. If main didn't move before the
  # merge, the push to main has the same files (the same git tree), so the
  # checks already passed: skip them and let Deploy start. The PR run leaves
  # a "ci-tree-<tree>" artifact as the marker once every check has passed.
  tested:
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      skip: ${{ steps.marker.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - id: marker
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.tree }}
        # Only markers made by runs of this repository (not a fork) count.
        run: |
          found=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=ci-tree-${TREE}" \
            --jq '[.artifacts[] | select(.expired | not)
                   | select(.workflow_run.head_repository_id == ${{ github.repository_id }})] | length')
          echo "skip=$([ "$found" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  check:
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://hub:hub@localhost:5432/hub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Video media prep runs ffmpeg in unit, integration and e2e tests. A
      # stalled package mirror once hung this step until the job's 20-minute
      # limit; fail fast instead, so a re-run can pick another mirror.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
        timeout-minutes: 5
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: openapi.json matches the API (intent 0004, API-4)
        run: pnpm openapi --check
      - run: pnpm test
      # Integration tests drive Chromium too (the Commit Swimming adapter).
      # The browser is cached per lockfile; its system packages install each run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:int
      - run: pnpm build
      - name: No dev sign-in shortcut in the production build
        run: pnpm check:build
      - run: pnpm test:e2e
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Mark these files as tested
        if: github.event_name == 'pull_request'
        run: echo "${{ needs.tested.outputs.tree }}" > tested-tree.txt
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-tree-${{ needs.tested.outputs.tree }}
          path: tested-tree.txt
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
