# XcodeGen spec for the iPhone app (intent 0004, plan N2.1). The .xcodeproj
# is generated (`xcodegen` in this folder) and not committed.
name: JaydenHub
options:
  bundleIdPrefix: com.jaydenguo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
# The team comes from Signing.xcconfig, which includes a git-ignored
# Local.xcconfig (plan O-1).
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
packages:
  HubKit:
    path: HubKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  HubApp:
    type: application
    platform: iOS
    sources: [HubApp]
    dependencies:
      - package: HubKit
        product: HubKit
      - package: HubKit
        product: HubAPI
      - target: HubWidgets
      - target: HubNotify
      - target: HubShare
    info:
      path: HubApp/Info.plist
      properties:
        # A generic name: nothing about Jayden on the home screen (AUTH-3).
        CFBundleDisplayName: Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Portrait everywhere except the video player (AppDelegate).
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        CFBundleURLTypes:
          - CFBundleURLName: com.jaydenguo.hub
            CFBundleURLSchemes: [jaydenguohub]
        NSFaceIDUsageDescription: Face ID keeps the hub locked when someone else picks up your phone.
        HubAppGroup: $(HUB_APP_GROUP)
        # Background app refresh keeps the widgets current (EXT-2).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.jaydenguo.hub.refresh]
        ITSAppUsesNonExemptEncryption: false
        # Only for development builds pointed at a local server (release
        # builds can't change the server).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaydenguo.hub$(HUB_BUNDLE_SUFFIX)
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # HubApp.entitlements (app group and push) or, for Personal Team
        # phone builds, HubApp-NoPush.entitlements: see Signing.xcconfig.
        # Both are kept by hand, not generated.
        CODE_SIGN_ENTITLEMENTS: $(HUB_APP_ENTITLEMENTS)
  HubWidgets:
    type: app-extension
    platform: iOS
    sources: [HubWidgets]
    dependencies:
      - package: HubKit
        product: HubKit
      - package: HubKit
        product: HubAPI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: HubWidgets/HubWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(HUB_APP_GROUP)]
    info:
      path: HubWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HubAppGroup: $(HUB_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaydenguo.hub$(HUB_BUNDLE_SUFFIX).widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
  # Fetches a notification's text before it shows (PUSH-2).
  HubNotify:
    type: app-extension
    platform: iOS
    sources: [HubNotify]
    dependencies:
      - package: HubKit
        product: HubKit
      - package: HubKit
        product: HubAPI
    entitlements:
      path: HubNotify/HubNotify.entitlements
      properties:
        com.apple.security.application-groups: [$(HUB_APP_GROUP)]
    info:
      path: HubNotify/Info.plist
      properties:
        CFBundleDisplayName: Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HubAppGroup: $(HUB_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaydenguo.hub$(HUB_BUNDLE_SUFFIX).notify
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
  # "Review in Hub" from the share sheet (EXT-3).
  HubShare:
    type: app-extension
    platform: iOS
    sources: [HubShare]
    dependencies:
      - package: HubKit
        product: HubKit
      - package: HubKit
        product: HubAPI
    entitlements:
      path: HubShare/HubShare.entitlements
      properties:
        com.apple.security.application-groups: [$(HUB_APP_GROUP)]
    info:
      path: HubShare/Info.plist
      properties:
        CFBundleDisplayName: Review in Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HubAppGroup: $(HUB_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaydenguo.hub$(HUB_BUNDLE_SUFFIX).share
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
  HubAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HubAppUITests]
    dependencies:
      - target: HubApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaydenguo.hub$(HUB_BUNDLE_SUFFIX).uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HubApp:
    build:
      targets:
        HubApp: all
        HubAppUITests: [test]
    test:
      targets: [HubAppUITests]
      environmentVariables:
        # The local development server the UI tests talk to.
        HUB_TEST_SERVER: http://localhost:3200
