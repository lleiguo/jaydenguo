# Local Postgres matching production (Cloud SQL for PostgreSQL 16).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
